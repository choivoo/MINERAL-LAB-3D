name: Verify CIF data for 22 minerals
on:
  workflow_dispatch:
  schedule:
    - cron: '20 4 * * 0'
  push:
    paths:
      - '.github/workflows/sync-cod-v5.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CIF parser
        run: python -m pip install gemmi==0.7.3
      - name: Fetch and validate experimental structures from COD
        run: python scripts/sync_cod_v5.py
      - name: Validate generated JavaScript and CIF report
        run: |
          node --check cod_crystals.js
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('structure-report.json').read_text())
          assert 0 <= report['verified_count'] <= 22
          print('Verified',report['verified_count'],'of 22',flush=True)
          PY
      - name: Commit verified data and status report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cod_crystals.js structure-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Update source-verified COD crystal structures and report"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
