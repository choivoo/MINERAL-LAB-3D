name: Deploy Mineral Lab to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install CIF parser
        run: python -m pip install gemmi==0.7.3
      - name: Verify additional mineral crystal structures
        continue-on-error: true
        timeout-minutes: 12
        run: python scripts/sync_cod.py
      - name: Stage website
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp manifest.webmanifest _site/manifest.webmanifest
          cp cod_crystals.js _site/cod_crystals.js
          cp structure-report.json _site/structure-report.json || true
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
